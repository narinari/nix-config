name: claude-code
version: 0.1.1
description: "Delegate complex design / architecture / code-review tasks to Claude Code (Opus 4.7) via subprocess. Streams stream-json output back to Hermes and emits per-call cost / session metadata via post_tool_call hook. Requires OAuth credentials seeded at $CLAUDE_CONFIG_DIR/.credentials.json (on khali, managed by hermes-agent-credentials.service from agenix snapshot)."
author: narinari
provides_tools:
  - claude_code
provides_hooks:
  - post_tool_call
